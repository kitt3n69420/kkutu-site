<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끄투 서버 모음 사이트</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body>
    <div class="site-header">
        <h1 class="site-title"><span class="accent-text">끄투</span>.사이트</h1>
        <div class="header-controls">
            <div class="time-machine-wrapper">
                <button class="time-machine-btn" id="timeMachineBtn">
                    <span class="tm-icon">⏳</span>
                    <span id="timeMachineDisplay">2026년 전반기</span>
                </button>
                <div class="time-machine-popup" id="timeMachinePopup">
                    <div class="tm-popup-title" id="timeMachinePopupDisplay">2026년 전반기</div>
                    <input type="range" id="timeMachineSlider" min="2016.5" step="0.5">
                    <div class="tm-popup-notice">자료가 부족해서 일부 서버는 정보가 잘못되었거나 빠져있을 수 있어요.<br>이런 정보를 발견하면 디스코드에 제보해주세요!
                    </div>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle">Dark Mode</button>
        </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
        <button class="category-tab active" data-category="끄투 서버">끄투 서버</button>
        <button class="category-tab tab-desktop-only" data-category="유틸리티 및 게임">유틸리티 및 게임</button>
        <button class="category-tab tab-mobile-only" data-category="유틸리티">유틸리티</button>
        <button class="category-tab tab-mobile-only" data-category="추천 게임">추천 게임</button>
    </div>

    <!-- Main Content Container -->
    <div class="content-container">
        <!-- Servers View -->
        <div class="view-section active" id="servers-view">
            <section class="server-section">
                <h2>끄투 서버 목록</h2>
                <div class="grid-container" id="grid">
                    <!-- Cards will be injected here -->
                </div>
            </section>
        </div>

        <!-- Extras View (Utilities + Games) -->
        <div class="view-section" id="extras-view">
            <div id="extras-container">
                <!-- Utility Section -->
                <section class="utility-section" data-section="utility">
                    <h2>유틸리티 사이트</h2>
                    <div class="utility-grid" id="utilityGrid">
                        <!-- Utility items injected here -->
                    </div>
                </section>

                <!-- Recommended Games Section -->
                <section class="utility-section" data-section="games">
                    <h2>추천 게임</h2>
                    <div class="utility-grid" id="gameGrid">
                        <!-- Game items injected here -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div class="contact-section">
        <a href="https://discord.com/invite/aEAVmrtU4w" target="_blank" class="contact-btn">서버 추가/수정 문의</a>
    </div>

    <footer>
        <p>&copy; 2026 끄투닷사이트, 냐옹이 제작, 모든 권리 보유.</p>
    </footer>

    <div class="detail-view" id="detailView">
        <div class="detail-overlay"></div>
        <div class="detail-card" id="detailCard">
            <button class="close-btn" id="backBtn">&times;</button>
            <!-- Content injected via JS -->
            <div id="detailStatic">
                <div class="card-title" id="detailTitle">Title</div>
                <div class="card-tags" id="detailTags"></div>
            </div>
            <div class="detail-content">
                <div class="description" id="detailDesc"></div>
                <div class="detail-related-links" id="detailRelatedLinks"></div>
                <div class="detail-actions">
                    <a href="#" class="btn" id="connectBtn">접속하기</a>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
